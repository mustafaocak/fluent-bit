# fluent-bit-values.yaml


kind: DaemonSet

image:
  repository: docker.io/fluent/fluent-bit
  # Overrides the image tag whose default is {{ .Chart.AppVersion }}
  # Set to "-" to not use the default value
  tag: 4.2-debug
  digest:
  pullPolicy: IfNotPresent

serviceAccount:
  create: true

rbac:
  create: true

tolerations:
  - operator: Exists

hostNetwork: false

dnsPolicy: ClusterFirst

securityContext:
  runAsUser: 0
  runAsGroup: 0

env: []

extraVolumes:
  - name: runlogjournal
    hostPath:
      path: /run/log/journal

  - name: varlogjournal
    hostPath:
      path: /var/log/journal

#  - name: machineid
#    hostPath:
#      path: /etc/machine-id
#
  - name: fluentbit-state
    hostPath:
      path: /var/lib/fluent-bit
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: runlogjournal
    mountPath: /run/log/journal
    readOnly: true

  - name: varlogjournal
    mountPath: /var/log/journal
    readOnly: true

#  - name: machineid
#    mountPath: /etc/machine-id
#    readOnly: true

  - name: fluentbit-state
    mountPath: /fluent-bit/state

config:

  service: |
    [SERVICE]
        Flush              5
        Daemon             Off
        Log_Level          info

        Parsers_File       parsers.conf

        HTTP_Server        On
        HTTP_Listen        0.0.0.0
        HTTP_Port          2020

        storage.path       /fluent-bit/state/storage
        storage.sync       normal
        storage.checksum   off
        storage.backlog.mem_limit 64M
# Configure Fluent Bit inputs, filters, and outputs
  inputs: |
    [INPUT]
        Name    systemd
        Tag     uio_logs_5000_systemd
        DB      /fluent-bit/state/systemd-k3s.db
        db.Sync   Normal

        Mem_Buf_Limit 100MB
        storage.type filesystem
        storage.pause_on_chunks_overlimit on

        Read_From_Tail On
        Lowercase On
        Threaded true

  filters: |
    [FILTER]
        Name modify
        Match uio_logs_5000_systemd

        Add dataops.data_processor dataops-logs-systemd

        Add event.module systemd
        Add event.provider systemd
        Add event.dataset systemd.journald

        Add data_stream.namespace prod
        Add data_stream.dataset systemd.journald

        Add service.name linux-systemd

    [FILTER]
        Name nest
        Match *

        Operation nest
        Wildcard dataops.*
        Nest_under dataops
        Remove_prefix dataops.

    [FILTER]
        Name nest
        Match *

        Operation nest
        Wildcard event.*
        Nest_under event
        Remove_prefix event.

    [FILTER]
        Name nest
        Match *

        Operation nest
        Wildcard data_stream.*
        Nest_under data_stream
        Remove_prefix data_stream.

    [FILTER]
        Name nest
        Match *

        Operation nest
        Wildcard service.*
        Nest_under service
        Remove_prefix service.

  outputs: |
    [OUTPUT]
        Name stdout
        Match kube.*
